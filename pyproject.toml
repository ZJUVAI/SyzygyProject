[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syzygy-mathbench"
version = "0.1.0"
description = "Verified mathematical construction benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12", "mpmath>=1.3", "networkx>=3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mathbench = "mathbench.cli:main"

[tool.setuptools.packages.find]
include = ["mathbench*", "tasks*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.txt", "data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests", "tasks"]
addopts = "--import-mode=importlib"
